plugins {
    // SNAPSHOT, not a pinned release: 26.1.2's official-mappings support needs a newer Loom than
    // any stable release has shipped as of this module's scaffolding - confirmed against a
    // working reference project on this same machine that resolves fine on 1.17-SNAPSHOT but
    // fails on 1.17.20 with "Failed to find official mojang mappings for 26.1.2". Revisit this
    // once Loom cuts a stable release that includes whatever unblocked that.
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // ai-companion-common is installed here via `mvn install` in ../common (see README.md).
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No Yarn mappings exist for this game version - see gradle.properties. Loom's built-in
    // official-mappings support is the only option here.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(implementation("com.riftforged:ai-companion-common:1.0.0"))
    // Minecraft itself already bundles Gson on the runtime classpath - compile-only, not included.
    compileOnly "com.google.code.gson:gson:2.11.0"
    // Not bundled with Minecraft, unlike Gson - has to be included for config.yml parsing.
    include(implementation("org.yaml:snakeyaml:2.2"))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
