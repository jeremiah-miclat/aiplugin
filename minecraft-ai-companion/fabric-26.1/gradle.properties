# Pinned against Fabric's own meta API (https://meta.fabricmc.net/v2/versions/...) at the time
# this module was scaffolded - re-check there before bumping any of these, don't guess.
#
# Unlike fabric-1.21.11, there is no Yarn mappings build for this game version (Fabric's meta API
# returns none, and intermediary shows version "0.0.0" - i.e. not generated) - this version line
# uses Mojang's own official mappings directly (see build.gradle's `mappings` line), which use
# different method/class names than Yarn for the same underlying game code.
#
# Pinned to the exact patch (26.1.2), not the bare "26.1" line: Mojang only publishes official
# mappings per exact game version, so Loom can't resolve mappings for a bare minor version - it
# needs 26.1.2 specifically. The module directory is still named fabric-26.1 (our own convention
# label), that's independent of the exact game_version pinned here.
minecraft_version=26.1.2
loader_version=0.19.3

mod_version=1.0.0
maven_group=com.riftforged
archives_base_name=ai-companion-fabric

fabric_version=0.155.2+26.1.2

# 26.1+ requires Java 25 (unlike 1.21.11's Java 21) - see build.gradle's toolchain block.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
