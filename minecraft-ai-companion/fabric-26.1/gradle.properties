# Pinned against Fabric's own meta API (https://meta.fabricmc.net/v2/versions/...) and
# FabricMC/fabric-example-mod's own "26.1.2" branch at the time this module was fixed - re-check
# those before bumping any of these, don't guess.
#
# Unlike fabric-1.21.11, there is no Yarn mappings build for this game version, and no mapping
# step of any kind is needed: Minecraft ships already-deobfuscated as of 26.1 (confirmed via
# https://fabricmc.net/2026/03/14/261.html), so build.gradle uses the new "net.fabricmc.fabric-loom"
# plugin id (not "fabric-loom") with no `mappings` line at all - see build.gradle's own comment
# for why the OLD build.gradle here, which just bumped the version of the OLD "fabric-loom" plugin
# id, kept failing with "Failed to find official mojang mappings for 26.1.2" no matter which
# version was tried.
#
# Pinned to the exact patch (26.1.2), matching FabricMC's own reference branch for this version -
# the module directory is still named fabric-26.1 (our own convention label, tracking the latest
# patch the way forge-26.1/ does), independent of the exact game_version pinned here.
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

mod_version=1.0.0
maven_group=com.riftforged
archives_base_name=ai-companion-fabric

fabric_version=0.155.2+26.1.2

# 26.1+ requires Java 25 (unlike 1.21.11's Java 21) - see build.gradle's toolchain block.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA (and, per FabricMC/fabric-example-mod's own 26.1.2 branch, this Loom version in
# general) isn't yet fully compatible with configuration cache -
# see https://github.com/FabricMC/fabric-loom/issues/1349.
org.gradle.configuration-cache=false
