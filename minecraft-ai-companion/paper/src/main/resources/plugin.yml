name: AiCompanion
version: '${project.version}'
main: com.riftforged.aicompanion.AiCompanionPlugin
api-version: '1.21'
author: AiCompanion
description: In-game AI chat companion (join greetings, "!ai" Q&A, item gives) — OpenRouter, OpenAI-compatible, or Anthropic.
commands:
  aicompanion:
    description: Manage the AI Companion plugin.
    usage: /<command> reload|config|get <key>|set <key> <value>|models list|add|remove <id>
    aliases: [aic]
    permission: aicompanion.reload
permissions:
  aicompanion.reload:
    description: Reload, view, and edit the AI Companion plugin's config.yml (server-info.md and kb/ reload too, but aren't editable via command).
    default: op
