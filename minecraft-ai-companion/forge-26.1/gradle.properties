# Targets the latest 26.1.x patch (26.1.2 as of scaffolding) - see
# https://files.minecraftforge.net/net/minecraftforge/forge/index_26.1.2.html. Re-check there
# before bumping, don't guess. Named "forge-26.1" (the minor line) rather than "forge-26.1.2"
# because, like forge-1.21.11, this module tracks whatever the latest patch of its line is, not
# one frozen dot-release - update minecraft_version/forge_version here as 26.1.x patches land.
minecraft_version=26.1.2
forge_version=26.1.2-64.1.0
eventbus_version=7.0.5

mod_version=1.0.0
maven_group=com.riftforged
archives_base_name=ai-companion-forge

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
net.minecraftforge.gradle.merge-source-sets=true
