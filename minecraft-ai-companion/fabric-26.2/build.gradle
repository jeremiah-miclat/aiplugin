plugins {
    // NOT the old "fabric-loom" plugin id - Minecraft ships unobfuscated as of 26.1, so Fabric
    // publishes this as a genuinely separate plugin (no remapping step at all, hence no mappings
    // block below) rather than a new capability bolted onto the old remapping-based plugin.
    // Confirmed against FabricMC/fabric-example-mod's own "26.1.2" branch build.gradle - this
    // project's earlier build.gradle kept the old "fabric-loom" id (just tried bumping its
    // version), which is why it kept failing with "Failed to find official mojang mappings for
    // 26.1.2" regardless of which 1.17.x/1.18.0-alpha.x version was requested.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // ai-companion-common is installed here via `mvn install` in ../common (see README.md).
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings block: Minecraft ships already-deobfuscated for 26.1+, so there's nothing to map.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(implementation("com.riftforged:ai-companion-common:1.0.0"))
    // Minecraft itself already bundles Gson on the runtime classpath - compile-only, not included.
    compileOnly "com.google.code.gson:gson:2.11.0"
    // Not bundled with Minecraft, unlike Gson - has to be included for config.yml parsing.
    include(implementation("org.yaml:snakeyaml:2.2"))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
