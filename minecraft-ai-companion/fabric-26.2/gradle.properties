# Pinned against Fabric's own meta API (https://meta.fabricmc.net/v2/versions/...) and
# FabricMC/fabric-example-mod's own "26.2" branch at the time this module was scaffolded -
# re-check those before bumping any of these, don't guess.
#
# Same story as fabric-26.1 (see that module's gradle.properties for the full explanation): no
# Yarn mappings build exists for this game version and no mapping step of any kind is needed -
# Minecraft has shipped already-deobfuscated since 26.1 (confirmed via
# https://fabricmc.net/2026/06/15/262.html), so build.gradle uses the "net.fabricmc.fabric-loom"
# plugin id with no `mappings` line at all.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

mod_version=1.0.0
maven_group=com.riftforged
archives_base_name=ai-companion-fabric

fabric_version=0.158.0+26.2

# 26.x requires Java 25 (unlike 1.21.11's Java 21) - see build.gradle's toolchain block.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA (and, per FabricMC/fabric-example-mod's own reference branch, this Loom version in
# general) isn't yet fully compatible with configuration cache -
# see https://github.com/FabricMC/fabric-loom/issues/1349.
org.gradle.configuration-cache=false
