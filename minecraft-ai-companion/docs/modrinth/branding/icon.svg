<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1033"/>
      <stop offset="100%" stop-color="#3a1866"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#33d6c0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- chat bubble -->
  <path d="M96 168 a48 48 0 0 1 48-48 h224 a48 48 0 0 1 48 48 v128 a48 48 0 0 1 -48 48 H232
           l-56 52 v-52 h-32 a48 48 0 0 1 -48-48 Z" fill="url(#bubble)"/>

  <!-- simple robot face inside the bubble -->
  <rect x="176" y="152" width="160" height="96" rx="24" fill="#1b1033"/>
  <circle cx="216" cy="200" r="14" fill="#33d6c0"/>
  <circle cx="296" cy="200" r="14" fill="#33d6c0"/>
  <rect x="216" y="228" width="80" height="8" rx="4" fill="#7c5cff"/>
  <rect x="248" y="130" width="16" height="24" fill="#1b1033"/>
  <circle cx="256" cy="122" r="10" fill="#33d6c0"/>

  <!-- minecraft-style pixel accent, bottom right -->
  <g fill="#33d6c0">
    <rect x="368" y="352" width="24" height="24"/>
    <rect x="392" y="352" width="24" height="24" fill="#7c5cff"/>
    <rect x="368" y="376" width="24" height="24" fill="#7c5cff"/>
    <rect x="392" y="376" width="24" height="24"/>
  </g>
</svg>
