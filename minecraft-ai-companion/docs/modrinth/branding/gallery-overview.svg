<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160b2b"/>
      <stop offset="100%" stop-color="#33165c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#33d6c0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- faint pixel-grid texture -->
  <g opacity="0.06" fill="#ffffff">
    <rect x="0" y="0" width="1920" height="1080" fill="none"/>
    <!-- sparse pixel dots for a minecraft-ish texture, avoid heavy tiling -->
    <rect x="80" y="80" width="16" height="16"/>
    <rect x="160" y="200" width="16" height="16"/>
    <rect x="1780" y="120" width="16" height="16"/>
    <rect x="1700" y="900" width="16" height="16"/>
    <rect x="120" y="900" width="16" height="16"/>
    <rect x="1840" y="500" width="16" height="16"/>
  </g>

  <!-- title -->
  <text x="120" y="180" font-size="88" font-weight="700" fill="#ffffff">AI Companion</text>
  <rect x="122" y="205" width="420" height="8" fill="url(#accent)"/>
  <text x="120" y="255" font-size="34" fill="#c9bfe8">In-game AI chat companion for your Minecraft server</text>

  <!-- mock chat window -->
  <rect x="120" y="320" width="820" height="420" rx="24" fill="#0f0820" stroke="#4a2d7a" stroke-width="2"/>
  <rect x="120" y="320" width="820" height="56" rx="24" fill="#241344"/>
  <circle cx="156" cy="348" r="8" fill="#ff5f56"/>
  <circle cx="182" cy="348" r="8" fill="#ffbd2e"/>
  <circle cx="208" cy="348" r="8" fill="#27c93f"/>
  <text x="240" y="356" font-size="20" fill="#a998d6">server chat</text>

  <text x="160" y="430" font-size="26" fill="#8f7fc0">Steve joined the server</text>
  <text x="160" y="470" font-size="26" fill="#33d6c0">mcAi: Welcome Steve! Type !ai if you need help.</text>
  <text x="160" y="530" font-size="26" fill="#e6e0f5">Steve: !ai how do I get to the nether portal?</text>
  <text x="160" y="580" font-size="26" fill="#33d6c0">mcAi: Head to spawn, the portal room is behind</text>
  <text x="160" y="612" font-size="26" fill="#33d6c0">the fountain. Need a flint and steel? I can give</text>
  <text x="160" y="644" font-size="26" fill="#33d6c0">you one.</text>
  <text x="160" y="700" font-size="24" fill="#8f7fc0">— powered by your own free Groq API key —</text>

  <!-- feature callouts -->
  <g font-size="30" fill="#ffffff">
    <circle cx="1010" cy="360" r="10" fill="#7c5cff"/>
    <text x="1040" y="370" font-weight="600">Works on Paper, Fabric, Forge &amp; NeoForge</text>
    <text x="1040" y="404" font-size="22" fill="#c9bfe8">1.21.11, 26.1, and 26.2</text>

    <circle cx="1010" cy="470" r="10" fill="#33d6c0"/>
    <text x="1040" y="480" font-weight="600">Answers questions from your own server info</text>
    <text x="1040" y="514" font-size="22" fill="#c9bfe8">rules, lore, and knowledge-base files you write</text>

    <circle cx="1010" cy="580" r="10" fill="#7c5cff"/>
    <text x="1040" y="590" font-weight="600">Optional item giving, with daily limits</text>
    <text x="1040" y="624" font-size="22" fill="#c9bfe8">per-player caps you fully control</text>

    <circle cx="1010" cy="690" r="10" fill="#33d6c0"/>
    <text x="1040" y="700" font-weight="600">Runs on a free-tier AI key</text>
    <text x="1040" y="734" font-size="22" fill="#c9bfe8">Groq by default — no credit card needed</text>
  </g>

  <text x="120" y="1010" font-size="24" fill="#6f5f99">MIT licensed  ·  bring your own free API key  ·  server-agnostic by design</text>
</svg>
